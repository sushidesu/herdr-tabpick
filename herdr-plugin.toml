# tabpick — pick a herdr tab, most recently used first.
#
# Two halves that only make sense together, which is why they ship as one
# plugin: the pane runs the picker, and the event hook records the focus order
# the picker sorts by. herdr exposes no last-focused timestamp, so that order
# has to be observed as it happens.
id = "sushidesu.tabpick"
name = "tabpick"
version = "0.1.0"
min_herdr_version = "0.7.4"
description = "Pick a tab across every workspace, most recently used first, or start a new one from a directory."
platforms = ["macos", "linux"]

# command resolves against the plugin root, which herdr uses as the cwd.
[[panes]]
id = "open"
title = "tabpick"
placement = "popup"
width = "90%"
height = "80%"
command = ["./bin/tabpick"]

# Fires on every tab focus — sidebar click, keybinding, or `herdr tab focus`
# alike — and touches one empty file per tab: the name is the tab_id, the mtime
# is when it was last focused. That directory is the map the picker wants; a log
# of every focus would instead grow with focuses rather than with tabs, and have
# to be replayed on every read. Keying by filename also makes each update atomic
# on its own key with no coordination, which is the binding constraint here:
# herdr spawns this hook independently per event, so it can neither lock nor
# safely read-modify-write a shared file. herdr creates HERDR_PLUGIN_STATE_DIR.
[[events]]
on = "tab.focused"
command = ["sh", "-c", "mkdir -p \"$HERDR_PLUGIN_STATE_DIR/tabs\" && touch \"$HERDR_PLUGIN_STATE_DIR/tabs/$HERDR_TAB_ID\""]

